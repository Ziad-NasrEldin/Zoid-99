services:
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["node", "dist/src/migrate.js"]
    env_file: .env.production
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8099:8099"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8099/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
