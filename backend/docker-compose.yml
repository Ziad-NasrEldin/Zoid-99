services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: zoid99
      POSTGRES_USER: zoid99
      POSTGRES_PASSWORD: zoid99
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoid99 -d zoid99"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zoid99-postgres:/var/lib/postgresql/data

volumes:
  zoid99-postgres:
